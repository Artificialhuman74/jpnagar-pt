<script>
const SERVICES = [
  { name: 'Spine & Back Care', tags: ['back'], helps: ['Back and neck pain', 'Slip disc and sciatica', 'Posture problems'], href: 'spine.html' },
  { name: 'Orthopaedic Physiotherapy', tags: ['joints'], helps: ['Joint and muscle pain', 'Frozen shoulder', 'Fracture recovery'], href: 'ortho.html' },
  { name: 'Sports Physiotherapy', tags: ['sports', 'joints'], helps: ['Sprains and ligament tears', 'Running and gym injuries', 'Safe return to sport'], href: 'sports.html' },
  { name: 'Post-Operative Rehab', tags: ['surgery'], helps: ['After knee or hip replacement', 'After fracture surgery', 'After spine surgery'], href: 'postop.html' },
  { name: 'Neurological Physiotherapy', tags: ['neuro'], helps: ['Stroke recovery', 'Parkinson’s and balance', 'Nerve injuries'], href: 'neuro.html' },
  { name: 'Women’s Health', tags: ['women'], helps: ['Pregnancy back pain', 'After delivery recovery', 'Pelvic floor care'], href: 'women.html' },
  { name: 'Paediatric Physiotherapy', tags: ['children'], helps: ['Delayed walking or crawling', 'Posture in children', 'Sports injuries in teens'], href: 'paeds.html' },
  { name: 'Geriatric Physiotherapy', tags: ['elderly', 'joints'], helps: ['Arthritis', 'Balance and fall prevention', 'Staying mobile'], href: 'geri.html' },
  { name: 'Home Care Physiotherapy', tags: ['elderly', 'surgery'], helps: ['When travel is hard', 'After a hospital stay', 'Bedside rehab'], href: 'homecare.html' },
  { name: 'Therapies & Equipment', tags: [], helps: ['Manual therapy and exercise', 'IFT, TENS and ultrasound', 'Traction and heat therapy'], href: 'therapies.html' }
];
const FILTERS = [['all', 'All'], ['back', 'Back & neck'], ['joints', 'Joints'], ['sports', 'Sports'], ['surgery', 'After surgery'], ['neuro', 'Stroke & nerves'], ['women', 'Women'], ['children', 'Children'], ['elderly', 'Elderly']];
const list = document.querySelector('[data-svcs]');
const cards = SERVICES.map(s => {
  const a = el('a', { class: 'svc', href: s.href || '#' },
    el('div', { class: 'photo tilt', 'data-service-photo': (s.href || '').replace('.html', '') }),
    el('div', {}, el('h2', {}, s.name), el('ul', {}, ...s.helps.map(h => el('li', {}, h)))),
    el('span', { class: 'go', 'aria-hidden': 'true' }, icon('chevron')));
  list.append(a); return a;
});
let current = 'all';
const fbar = document.querySelector('[data-filters]');
FILTERS.forEach(([k, label]) => {
  const p = el('button', { class: 'pill' + (k === current ? ' on' : ''), role: 'radio', 'aria-checked': k === current }, label);
  p.addEventListener('click', () => { current = k; render(); });
  fbar.append(p);
});
function render() {
  [...fbar.children].forEach((p, i) => { const on = FILTERS[i][0] === current; p.classList.toggle('on', on); p.setAttribute('aria-checked', on); });
  let n = 0;
  cards.forEach((c, i) => {
    const show = current === 'all' || SERVICES[i].tags.includes(current);
    c.hidden = !show; if (show) { n++; c.style.animation = 'none'; void c.offsetWidth; c.style.animation = `rise .45s var(--ease) ${n * .04}s backwards`; }
  });
  // only says something when a filter narrows the list
  document.querySelector('[data-count]').textContent = current === 'all' ? '' : `${n} matching`;
}
render();

</script>
