<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home and Booking Mockup</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap");
:root{--bg:#ECEEF3;--ink:#141629;--muted:#565A6E;--act:#2B3192}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",-apple-system,system-ui,sans-serif;padding:32px 16px 48px}
h1{font-size:24px;text-align:center;letter-spacing:-.02em}
p.sub{text-align:center;color:var(--muted);font-size:15px;margin:6px auto 30px;max-width:640px}
p.sub a{color:var(--act);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:40px 40px;justify-content:center}
figure{display:flex;flex-direction:column;align-items:center;gap:14px}
figcaption{text-align:center;max-width:380px}
figcaption b{display:block;font-size:17px}
figcaption span{font-size:14px;color:var(--muted)}
.phone{width:410px;height:864px;border-radius:52px;overflow:hidden;border:10px solid #111;box-shadow:0 30px 60px -25px rgba(0,0,0,.45);background:#fff;max-width:calc(100vw - 32px)}
iframe{width:390px;height:844px;border:0;display:block}
</style></head><body>
<h1>Home + booking flow</h1>
<p class="sub">Both phones are live: tap Book, the body map, branches, days and slots, and go all the way to the confirmation. Open hours are real (IST); distances, taken slots and reviews are samples. <a href="../canon/">Earlier iterations</a></p>
<div class="row">
 <figure><div class="phone"><iframe src="home.html" title="Home"></iframe></div><figcaption><b>Home</b><span>Photo + Book, your first visit, why patients choose us with Google reviews, gallery.</span></figcaption></figure>
 <figure><div class="phone"><iframe src="book.html" title="Booking"></iframe></div><figcaption><b>Book</b><span>Body map (male/female, front/back, 3D turn) → time and therapist → details → booked.</span></figcaption></figure>
 <figure><div class="phone"><iframe src="services.html" title="Services"></iframe></div><figcaption><b>Services</b><span>Filter by situation; Spine &amp; Back Care opens the service page template.</span></figcaption></figure>
 <figure><div class="phone"><iframe src="branches.html" title="Branches"></iframe></div><figcaption><b>Branches</b><span>Use my location or pick an area: cards slide into nearest-first order. Arekere opens the branch page.</span></figcaption></figure>
 <figure><div class="phone"><iframe src="team.html" title="Team"></iframe></div><figcaption><b>Team</b><span>Know more opens a sheet; tap a degree to see what it means; book with that therapist.</span></figcaption></figure>
</div>
</body></html>
