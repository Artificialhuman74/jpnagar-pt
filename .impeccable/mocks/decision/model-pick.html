<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prescription Pad sketch</title>
<style>
:root{--paper:#FFFFFF;--tint:#F1EFEF;--maroon:#6B1426;--rule:#D9D6D6;--ink:#18120F}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--paper);font-family:Georgia,"Times New Roman",serif;color:var(--ink);position:relative}
.head{padding:20px 20px 14px;border-bottom:3px double var(--maroon);display:flex;gap:14px;align-items:center}
.logo{width:58px;height:44px;border-radius:6px;background:linear-gradient(90deg,#2B3990 0 45%,#29ABE2 55%)}
.head b{display:block;font-size:22px;color:var(--maroon)}
.head span{font-family:-apple-system,system-ui,sans-serif;font-size:12px;letter-spacing:.06em;color:var(--maroon)}
.time{margin:14px 20px 0;border:1.5px solid var(--maroon);display:grid;grid-template-columns:1fr 1fr;font-family:-apple-system,system-ui,sans-serif}
.time div{padding:10px;font-size:14px}.time div+div{border-left:1.5px solid var(--maroon)}
.rx{position:absolute;top:196px;left:20px;font-size:64px;font-style:italic;color:var(--maroon)}
.lines{position:absolute;top:290px;left:20px;right:20px}
.line{height:64px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:8px;font-size:28px;font-style:italic}
.line small{font-family:-apple-system,system-ui,sans-serif;font-style:normal;font-size:13px;color:#7A6E6E}
.line.x{color:#C2BBBB;text-decoration:line-through}
.line.on{color:var(--maroon)}
.stamp{position:absolute;top:520px;right:28px;width:120px;height:120px;border-radius:50%;border:4px solid var(--maroon);color:var(--maroon);display:grid;place-items:center;transform:rotate(-14deg);font-family:-apple-system,system-ui,sans-serif;font-weight:800;font-size:22px;opacity:.85}
.cta{position:absolute;left:20px;width:200px;top:580px;height:58px;border-radius:8px;background:var(--maroon);color:#fff;display:grid;place-items:center;font-family:-apple-system,system-ui,sans-serif;font-size:22px;font-weight:700}
.dock{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:334px;height:68px;border-radius:26px;background:rgba(255,255,255,.62);border:1px solid var(--rule);backdrop-filter:blur(18px);box-shadow:0 14px 30px -14px rgba(0,0,0,.4);display:flex;justify-content:space-around;align-items:center}
.dock i{width:26px;height:26px;border-radius:8px;background:#9A9090}
.dock .bk{width:56px;height:56px;border-radius:28px;background:var(--maroon)}
</style></head><body>
<div class="head"><div class="logo"></div><div><b>Dr. P. Senthil (PT)</b><span>MPT · COMT · MIAP · EST. 2012</span></div></div>
<div class="time"><div>Arekere · open now</div><div>9–1 · 4–9</div></div>
<div class="rx">Rx</div>
<div class="lines">
 <div class="line">4:30 pm <small>Arekere · 1.2 km</small></div>
 <div class="line x">5:00 pm <small>taken</small></div>
 <div class="line on">5:30 pm <small>your slot</small></div>
</div>
<div class="cta">Book 5:30 pm</div>
<div class="stamp">BOOKED</div>
<nav class="dock"><i></i><i></i><span class="bk"></span><i></i><i></i></nav>
</body></html>
