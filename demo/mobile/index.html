<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile App Demo</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap");
:root{--bg:#ECEEF3;--ink:#141629;--muted:#565A6E;--act:#2B3192}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",-apple-system,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
/* a real phone: a 390 × 844 screen, the whole device scaled down to fit the window so it keeps its shape */
.fit{width:calc(410px * var(--k,1));height:calc(864px * var(--k,1));flex:none}
.phone{width:410px;height:864px;border-radius:52px;overflow:hidden;border:10px solid #111;box-shadow:0 30px 60px -25px rgba(0,0,0,.45);background:#fff;transform:scale(var(--k,1));transform-origin:0 0}
iframe{width:100%;height:100%;border:0;display:block}
p{font-size:14px;color:var(--muted);text-align:center}
p a{color:var(--act);font-weight:700}
</style></head><body>
<div class="stage">
  <div class="fit"><div class="phone"><iframe src="home.html" title="J.P. Nagar Physio mobile app"></iframe></div></div>
  <p>Use the dock inside the phone to move around. <a href="home.html">Open full screen</a> · <a href="../index.html">Back to demo</a></p>
</div>
<script>
const fit = () => document.documentElement.style.setProperty('--k', Math.min(1, (innerHeight - 90) / 864, (innerWidth - 32) / 410).toFixed(3));
fit(); addEventListener('resize', fit);
</script>
</body></html>
