<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Figtree,system-ui,sans-serif;background:#F3F4F7;color:#141629;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:52px 20px 14px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.top small{display:block;font-size:14px;font-weight:600;color:#565A6E}
.av{width:40px;height:40px;border-radius:50%;background:#E6F6FD;color:#0070A8;display:grid;place-items:center;font-weight:800}
.dock{position:absolute;left:14px;right:14px;bottom:18px;height:68px;border-radius:24px;background:#fff;box-shadow:0 10px 30px -14px rgba(20,22,41,.35);display:flex;justify-content:space-around;align-items:center;font-size:12px;font-weight:700;color:#666A7D}
.dock span.on{color:#2B3192}
.btn{background:#2B3192;color:#fff;border-radius:16px;font-weight:750;display:flex;align-items:center;justify-content:center}
</style><style>
.hi{padding:56px 22px 6px}.hi small{font-size:15px;font-weight:600;color:#565A6E}.hi h1{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:4px}
.next{margin:18px 16px 0;padding:16px 18px;border-radius:22px;background:#2B3192;color:#fff}.next small{font-size:13px;font-weight:700;color:rgba(255,255,255,.75)}.next b{display:block;font-size:22px;margin-top:2px}.next p{font-size:14px;color:rgba(255,255,255,.85)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 16px 0}
.door{height:150px;border-radius:24px;background:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(20,22,41,.06)}
.door .n{font-size:40px;font-weight:800;letter-spacing:-.04em;color:#2B3192;line-height:1}.door b{font-size:18px;line-height:1.15}.door .ic{width:40px;height:40px;border-radius:14px;background:#E6F6FD}
</style></head><body>
<div class="hi"><small>Good morning, Dr. Senthil</small><h1>What would you like to do?</h1></div>
<div class="next"><small>NEXT · 10:00 · JP Nagar</small><b>Ramesh K.</b><p>Knee · Any physiotherapist</p></div>
<div class="doors">
<div class="door"><span class="n">9</span><b>Today's bookings</b></div>
<div class="door"><span class="ic"></span><b>Add a booking</b></div>
<div class="door"><span class="ic"></span><b>Days off &amp; timings</b></div>
<div class="door"><span class="ic"></span><b>Website text &amp; photos</b></div>
</div>
</body></html>
