<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glazed Partition sketch</title>
<style>
:root{--clear:#FFFFFF;--seed:#F3F4F2;--bar:#141414;--ox:#6E1423}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--bar);font-family:-apple-system,"Helvetica Neue",system-ui,sans-serif;color:var(--bar)}
.wall{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:84px 150px 340px 110px 1fr;gap:6px;padding:6px}
.p{background:var(--seed);padding:14px;position:relative}
.p.clear{background:linear-gradient(160deg,#fff,#EEF0EE)}
.logo{grid-column:1/2}
.logo i{display:block;width:56px;height:42px;border-radius:6px;background:linear-gradient(90deg,#2B3990 0 45%,#29ABE2 55%)}
.h{grid-column:1/4;font-size:36px;line-height:1.02;font-weight:800;letter-spacing:-.03em}
.book{grid-column:1/4}
.book h2{font-size:28px;font-weight:800}
.book p{font-size:14px;opacity:.7;margin-top:4px}
.sl{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bar);padding:4px}
.sl div{height:62px;background:var(--clear);display:grid;place-items:center;font-size:22px;font-weight:750}
.sl .x{background:rgba(255,255,255,.55);color:#aaa;text-decoration:line-through}
.sl .on{background:var(--ox);color:#fff}
.go{margin-top:16px;height:56px;background:var(--bar);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}
.s{font-size:13px}
.dock{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:334px;height:68px;border-radius:26px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(18px);display:flex;justify-content:space-around;align-items:center}
.dock i{width:26px;height:26px;border-radius:8px;background:#555}
.dock .bk{width:56px;height:56px;border-radius:28px;background:var(--ox)}
</style></head><body>
<div class="wall">
 <div class="p clear logo"><i></i></div><div class="p"></div><div class="p clear"></div>
 <div class="p clear h">Physio near you, booked today.</div>
 <div class="p clear book"><h2>Arekere · open now</h2><p>1.2 km · closes 9 pm</p>
  <div class="sl"><div>4:30</div><div class="x">5:00</div><div class="on">5:30</div><div>6:00</div><div>6:30</div><div>7:00</div></div>
  <div class="go">Book 5:30 pm</div></div>
 <div class="p s">★ Google</div><div class="p clear s">Dr. P. Senthil</div><div class="p s">3 branches</div>
 <div class="p clear" style="grid-column:1/4"></div>
</div>
<nav class="dock"><i></i><i></i><span class="bk"></span><i></i><i></i></nav>
</body></html>
