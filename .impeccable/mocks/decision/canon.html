<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Category standard sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#F4F3F2;font-family:-apple-system,system-ui,sans-serif;color:#1A1416}
header{height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 1px 0 #e8e5e4}
header i{width:56px;height:42px;border-radius:6px;background:linear-gradient(90deg,#2B3990 0 45%,#29ABE2 55%)}
header b{width:28px;height:20px;border-top:3px solid #1A1416;border-bottom:3px solid #1A1416}
.hero{height:360px;background:linear-gradient(180deg,rgba(26,20,22,.1),rgba(26,20,22,.75)),#B9B1AF;position:relative}
.hero h1{position:absolute;left:20px;right:20px;bottom:92px;color:#fff;font-size:36px;line-height:1.08;font-weight:750}
.hero a{position:absolute;left:20px;bottom:28px;height:52px;width:200px;border-radius:12px;background:#8E1B2C;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}
h2{margin:28px 20px 14px;font-size:26px;font-weight:750}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.card{height:150px;border-radius:16px;background:#fff;box-shadow:0 4px 14px -6px rgba(0,0,0,.15)}
</style></head><body>
<header><i></i><b></b></header>
<div class="hero"><h1>Expert physiotherapy in South Bangalore</h1><a>Book appointment</a></div>
<h2>Our services</h2>
<div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div>
</body></html>
